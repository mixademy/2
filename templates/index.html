<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        /* Márkajelzés és ikonok */
        .orion-brand {
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
        }

        .orion-logo {
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            min-height: 36px !important;
            flex-shrink: 0 !important;
            overflow: visible !important;
            display: block !important;
        }

        .spinning-ring {
            transform-origin: 50px 50px !important;
            transform-box: view-box !important;
        }

        .fa-spinner,
        .fa-circle-notch,
        .fa-spin {
            display: inline-block !important;
            width: 24px !important;
            height: 24px !important;
            line-height: 24px !important;
            text-align: center !important;
            transform-origin: center center !important;
            animation: fa-spin 1s linear infinite !important;
            margin: 0 auto !important;
        }

        /* 3 pöttyös menü */
        .chat-actions {
            position: relative;
        }

        .dots-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .dots-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: #1e1e2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex-direction: column;
            min-width: 120px;
            z-index: 50;
            overflow: hidden;
            display: none;
        }

        .chat-dropdown.show {
            display: flex;
        }

        .chat-dropdown button {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-dropdown button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown button.delete-action:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Üzenet buborékok */
        .message-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }

        .message-wrapper.assistant-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .message.user {
            background: #9333ea;
            color: white;
            border-bottom-right-radius: 4px;
            max-width: 80%;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 100%;
            border-bottom-left-radius: 4px;
            box-sizing: border-box;
        }

        .edit-message-btn {
            position: absolute;
            left: -25px;
            top: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
        }

        .message-wrapper.user-wrapper:hover .edit-message-btn {
            opacity: 1;
        }

        /* Kompakt beviteli mező (kapszula) */
        .input-area {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            padding: 12px 15px !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .input-wrapper {
            max-width: 750px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: flex !important;
            align-items: flex-end !important;
            gap: 8px !important;
            background: rgba(30, 30, 46, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 24px !important;
            padding: 8px 12px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
        }

        #file-preview-container {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 46, 0.9);
            border: 1px solid rgba(163, 112, 247, 0.3);
            border-radius: 12px;
            padding: 8px 15px;
            margin-bottom: 8px;
            max-width: 750px;
            width: 100%;
            box-sizing: border-box;
        }

        .model-select {
            appearance: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px 6px 6px;
            outline: none;
        }

        .model-select option {
            background: #1e1e2e;
            color: white;
        }

        .disclaimer {
            max-width: 750px;
            width: 100%;
            text-align: center !important;
            font-size: 10px;
            opacity: 0.5;
            margin-top: 6px;
        }

        /* PC és mobil oldalsáv beállítások */
        .sidebar {
            transition: width 0.3s ease, transform 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        }

        @media (min-width: 769px) {
            .sidebar.collapsed {
                width: 0 !important;
                min-width: 0 !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                border: none !important;
                overflow: hidden !important;
                opacity: 0 !important;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 1000;
                width: 270px;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-overlay.active {
                display: block;
            }

            .messages-container {
                padding: 12px !important;
            }
        }

        /* --- TELJES KÖRŰ VILÁGOS MÓD (LIGHT MODE) --- */
        body.light-mode {
            background-color: #f1f5f9 !important;
            color: #0f172a !important;
        }

        body.light-mode .app-container {
            background: rgba(255, 255, 255, 0.95) !important;
        }

        body.light-mode .sidebar {
            background: #ffffff !important;
            border-right-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-header {
            background: #ffffff !important;
            border-bottom-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .input-wrapper {
            background: #ffffff !important;
            border: 1px solid rgba(0, 0, 0, 0.15) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
        }

        body.light-mode .input-wrapper textarea {
            color: #0f172a !important;
        }

        body.light-mode .message.assistant {
            background: #ffffff !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
        }

        body.light-mode .chat-list-item {
            color: #475569 !important;
        }

        body.light-mode .chat-list-item:hover,
        body.light-mode .chat-list-item.active {
            background: rgba(0, 0, 0, 0.05) !important;
            color: #0f172a !important;
        }

        body.light-mode .chat-dropdown {
            background: #ffffff !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-dropdown button {
            color: #0f172a !important;
        }

        body.light-mode .model-select {
            color: #475569 !important;
        }

        body.light-mode .model-select option {
            background: #ffffff !important;
            color: #0f172a !important;
        }

        body.light-mode .circle-send-btn {
            background: #0f172a !important;
            color: #ffffff !important;
        }

        body.light-mode .broadcast-content {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode select {
            background: #f8fafc !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.2) !important;
        }
    </style>
</head>

<body data-user="{{ username }}" class="dark-mode">
    <div class="liquid-bg">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>
    </div>

    <div class="glass-panel app-container">
        <div class="mobile-overlay" id="mobile-overlay"></div>

        <!-- OLDALSÁV -->
        <aside class="sidebar" id="sidebar">
            <button id="close-menu-btn" class="close-menu-btn"><i class="fas fa-times"></i></button>

            <div class="orion-brand">
                <svg class="orion-logo" viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="60 30"
                        stroke-linecap="round" />
                    <circle cx="32" cy="68" r="5" fill="#ffffff" />
                    <circle cx="50" cy="50" r="6" fill="#a370f7" />
                    <circle cx="68" cy="32" r="5" fill="#ffffff" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#a370f7" />
                            <stop offset="1" stop-color="#4f46e5" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1 class="orion-title">Orion <span>AI</span></h1>
            </div>

            <button id="new-chat-btn" class="glass-btn compact-btn"
                style="padding: 10px 14px; font-size: 13px; border-radius: 10px;">
                <i class="fas fa-plus"></i> Új beszélgetés
            </button>

            <div class="chat-list" id="chat-list"></div>

            <div class="user-info-bottom">
                {% if username == 'admin' %}
                <a href="{{ url_for('admin_panel') }}" class="glass-btn compact-btn"
                    style="text-decoration: none; text-align: center; margin-bottom: 10px; display: block; padding: 8px;">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </a>
                {% endif %}
                <div class="user-info-content">
                    {% if username == 'Vendég' %}
                    <span><i class="fas fa-user-secret" style="color: var(--text-muted);"></i> <b>{{ username
                            }}</b></span>
                    <a href="{{ url_for('login') }}" class="logout-link"
                        style="color: var(--accent-color); font-weight: 600;"><i class="fas fa-sign-in-alt"></i>
                        Belépés</a>
                    {% else %}
                    <span><i class="fas fa-user-astronaut"></i> <b>{{ username }}</b></span>
                    <a href="{{ url_for('logout') }}" class="logout-link"><i class="fas fa-sign-out-alt"></i>
                        Kilépés</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <!-- CHAT ABLAK -->
        <main class="chat-window">
            <div class="chat-header"
                style="display: flex; align-items: center; justify-content: space-between; padding: 12px 15px;">
                <div style="display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1;">
                    <button id="mobile-menu-btn"
                        style="background: transparent; border: none; font-size: 18px; cursor: pointer; color: inherit;"
                        title="Menü">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="current-chat-title"
                        style="font-size: 15px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        <i class="fas fa-sparkles"></i> Orion AI</h2>
                </div>

                <div style="display: flex; align-items: center; gap: 8px;">
                    <!-- IDE KERÜL A MODELLVÁLASZTÓ MOBILON -->
                    <div id="header-model-slot"></div>

                    <button id="open-settings-btn"
                        style="background: transparent; border: none; color: inherit; font-size: 18px; cursor: pointer; opacity: 0.7; padding: 4px;"
                        title="Beállítások">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messages-container"></div>

            <div class="input-area">
                <div id="file-preview-container">
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
                        <i class="fas fa-file-alt" style="color: var(--accent-color);"></i>
                        <span id="file-preview-name">file.txt</span>
                        <span id="file-preview-loading"
                            style="display:none; color: var(--accent-color); font-size: 11px;"><i
                                class="fas fa-spinner fa-spin"></i></span>
                    </div>
                    <button id="remove-file-btn"
                        style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i
                            class="fas fa-times"></i></button>
                </div>

                <div class="input-wrapper">
                    <label for="file-upload" class="attach-btn" title="Fájl csatolása"
                        style="background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-bottom: 2px;">
                        <i class="fas fa-plus" style="font-size: 12px;"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;"
                        accept=".pdf,.txt,.py,.js,.html,.css,.jpg,.jpeg,.png,.webp">

                    <textarea id="message-input" placeholder="Írj üzenetet..." rows="1"
                        style="flex: 1; background: transparent; border: none; color: inherit; resize: none; outline: none; font-size: 14px; line-height: 20px; padding: 6px 0; max-height: 120px;"></textarea>

                    <div class="input-controls"
                        style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-bottom: 2px;">
                        <!-- IDE KERÜL A MODELLVÁLASZTÓ PC-N -->
                        <div id="footer-model-slot">
                            <select id="model-selector" class="model-select">
                                <option value="smart">🧠 Smart</option>
                                <option value="fast">⚡ Fast</option>
                                <option value="creative">🔥 Creative</option>
                                <option value="code">💻 Code</option>
                            </select>
                        </div>
                        <button id="send-btn" class="circle-send-btn"
                            style="background: var(--text-main); color: #000; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i
                                class="fas fa-arrow-up" style="font-size: 12px;"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Az Orion AI hibázhat. Ellenőrizd a fontos adatokat.
                </div>
            </div>
        </main>
    </div>

    <!-- BEÁLLÍTÁSOK MODAL -->
    <div id="settings-modal" class="broadcast-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div class="glass-panel broadcast-content"
            style="text-align: left; max-width: 380px; width: 90%; padding: 20px; border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--accent-color); margin: 0; font-size: 18px;"><i class="fas fa-sliders-h"></i>
                    Beállítások</h3>
                <button id="close-settings-btn"
                    style="background: transparent; border: none; color: inherit; cursor: pointer; font-size: 18px;"><i
                        class="fas fa-times"></i></button>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 12px; opacity: 0.8;">Megjelenés</label>
                <select id="theme-select"
                    style="width: 100%; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;">
                    <option value="dark">🌙 Sötét mód</option>
                    <option value="light">☀️ Világos mód</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 4px; font-size: 12px; opacity: 0.8;">Nyelv</label>
                <select id="language-select"
                    style="width: 100%; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;">
                    <option value="hu">🇭🇺 Magyar</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <button id="save-settings-btn" class="glass-btn"
                style="width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; cursor: pointer;">Mentés</button>
        </div>
    </div>

    <!-- RENDSZERÜZENET MODAL -->
    <div id="broadcast-modal" class="broadcast-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div class="glass-panel broadcast-content"
            style="padding: 20px; border-radius: 16px; text-align: center; max-width: 320px; width: 90%;">
            <div style="font-size: 32px; color: var(--accent-color);"><i class="fas fa-bullhorn"></i></div>
            <h3 style="font-size: 16px; font-weight: 600; margin: 10px 0;">Rendszerüzenet</h3>
            <p id="broadcast-text-content"
                style="font-size: 13px; line-height: 1.4; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: left;">
            </p>
            <button id="close-broadcast-btn" class="glass-btn"
                style="padding: 8px; font-size: 13px; border-radius: 8px; width: 100%; margin-top: 10px;">Bezárás</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        // Dinamikusan áthelyezzük a modellválasztót mobilon a fejlécbe, PC-n pedig vissza alulra
        function adaptModelSelector() {
            const modelSelector = document.getElementById('model-selector');
            const headerSlot = document.getElementById('header-model-slot');
            const footerSlot = document.getElementById('footer-model-slot');

            if (window.innerWidth <= 768) {
                if (modelSelector && headerSlot && !headerSlot.contains(modelSelector)) {
                    headerSlot.appendChild(modelSelector);
                }
            } else {
                if (modelSelector && footerSlot && !footerSlot.contains(modelSelector)) {
                    footerSlot.appendChild(modelSelector);
                }
            }
        }
        window.addEventListener('resize', adaptModelSelector);
        window.addEventListener('DOMContentLoaded', adaptModelSelector);

        // Hamburger és oldalsáv kezelés
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                if (window.innerWidth > 768) {
                    sidebar.classList.toggle('collapsed');
                } else {
                    sidebar.classList.add('mobile-open');
                    mobileOverlay.classList.add('active');
                }
            });
        }

        if (closeMenuBtn) closeMenuBtn.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });
        if (mobileOverlay) mobileOverlay.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });

        // Beállítások & Világos Mód mentése és betöltése
        const settingsBtn = document.getElementById('open-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const themeSelect = document.getElementById('theme-select');
        const languageSelect = document.getElementById('language-select');

        if (localStorage.getItem('orion_theme') === 'light') {
            document.body.classList.add('light-mode');
            if (themeSelect) themeSelect.value = 'light';
        }
        if (localStorage.getItem('orion_language') && languageSelect) {
            languageSelect.value = localStorage.getItem('orion_language');
        }

        if (settingsBtn) settingsBtn.onclick = () => settingsModal.style.display = 'flex';
        if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsModal.style.display = 'none';
        if (saveSettingsBtn) {
            saveSettingsBtn.onclick = () => {
                localStorage.setItem('orion_theme', themeSelect.value);
                if (themeSelect.value === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
                localStorage.setItem('orion_language', languageSelect.value);
                settingsModal.style.display = 'none';
            };
        }
    </script>
</body>

</html>
