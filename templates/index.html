<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        /* Forgó logó animáció */
        @keyframes spinLogo {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinning-ring {
            transform-origin: 50px 50px !important;
            transform-box: view-box !important;
            animation: spinLogo 12s linear infinite !important;
        }

        /* Új beszélgetés gomb - tiszta lila */
        #new-chat-btn {
            background: #a370f7 !important;
            color: #ffffff !important;
            border: none !important;
            font-weight: 600 !important;
        }

        #new-chat-btn:hover {
            opacity: 0.9 !important;
        }

        /* FEJLÉC ÉS GOMBOK HELYREÁLLÍTÁSA (INLINE STÍLUSOK A BIZTOS MŰKÖDÉSHEZ) */
        .chat-header {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 15px 20px !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .header-left {
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
        }

        #mobile-menu-btn {
            background: transparent !important;
            border: none !important;
            color: inherit !important;
            font-size: 20px !important;
            cursor: pointer !important;
            padding: 5px !important;
        }

        #open-settings-btn {
            background: transparent !important;
            border: none !important;
            color: inherit !important;
            font-size: 20px !important;
            cursor: pointer !important;
            opacity: 0.8 !important;
            padding: 5px !important;
            transition: opacity 0.2s !important;
        }

        #open-settings-btn:hover {
            opacity: 1 !important;
        }

        /* Világos mód tökéletes kontraszt (sötét szövegekkel) */
        body.light-mode {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        body.light-mode .app-container {
            background: #ffffff !important;
        }

        body.light-mode .sidebar {
            background: #f1f5f9 !important;
            border-right: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-header {
            background: #ffffff !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
        }

        body.light-mode .orion-title,
        body.light-mode h1,
        body.light-mode h2,
        body.light-mode h3 {
            color: #0f172a !important;
        }

        body.light-mode .chat-list-item {
            color: #334155 !important;
        }

        body.light-mode .chat-list-item:hover,
        body.light-mode .chat-list-item.active {
            background: rgba(0, 0, 0, 0.05) !important;
            color: #0f172a !important;
        }

        body.light-mode .message.assistant {
            background: #f1f5f9 !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
        }

        body.light-mode .input-wrapper {
            background: #ffffff !important;
            border: 1px solid rgba(0, 0, 0, 0.15) !important;
        }

        body.light-mode .input-wrapper textarea {
            color: #0f172a !important;
        }

        body.light-mode .user-info-content {
            color: #334155 !important;
        }

        body.light-mode .chat-dropdown {
            background: #ffffff !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-dropdown button {
            color: #0f172a !important;
        }

        body.light-mode .chat-dropdown button:hover {
            background: rgba(0, 0, 0, 0.05) !important;
        }
    </style>
</head>

<body data-user="{{ username }}" class="dark-mode">
    <div class="liquid-bg">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>
    </div>

    <div class="glass-panel app-container">
        <div class="mobile-overlay" id="mobile-overlay"></div>

        <!-- OLDALSÁV -->
        <aside class="sidebar" id="sidebar">
            <button id="close-menu-btn" class="close-menu-btn"><i class="fas fa-times"></i></button>

            <div class="orion-brand">
                <svg class="orion-logo" width="40" height="40" viewBox="0 0 100 100" fill="none">
                    <g class="spinning-ring">
                        <circle cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="60 30"
                            stroke-linecap="round" />
                    </g>
                    <circle cx="32" cy="68" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)" />
                    <circle cx="50" cy="50" r="6" fill="#a370f7" filter="drop-shadow(0 0 8px #a370f7)" />
                    <circle cx="68" cy="32" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)" />
                    <line x1="35" y1="65" x2="46" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                    <line x1="54" y1="46" x2="65" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#a370f7" />
                            <stop offset="1" stop-color="#4f46e5" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1 class="orion-title">Orion <span>AI</span></h1>
            </div>

            <button id="new-chat-btn" class="glass-btn compact-btn">
                <i class="fas fa-plus"></i> Új beszélgetés
            </button>

            <div class="chat-list" id="chat-list"></div>

            <div class="user-info-bottom">
                {% if username == 'admin' %}
                <a href="{{ url_for('admin_panel') }}" class="glass-btn compact-btn"
                    style="text-decoration: none; text-align: center; margin-bottom: 10px; display: block;">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </a>
                {% endif %}
                <div class="user-info-content">
                    {% if username == 'Vendég' %}
                    <span><i class="fas fa-user-secret" style="color: var(--text-muted);"></i> <b>{{ username
                            }}</b></span>
                    <a href="{{ url_for('login') }}" class="logout-link"
                        style="color: var(--accent-color); font-weight: 600;"><i class="fas fa-sign-in-alt"></i>
                        Belépés</a>
                    {% else %}
                    <span><i class="fas fa-user-astronaut"></i> <b>{{ username }}</b></span>
                    <a href="{{ url_for('logout') }}" class="logout-link"><i class="fas fa-sign-out-alt"></i>
                        Kilépés</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <!-- CHAT ABLAK -->
        <main class="chat-window">
            <div class="chat-header">
                <div class="header-left">
                    <button id="mobile-menu-btn" title="Menü nyitása"><i class="fas fa-bars"></i></button>
                    <h2 id="current-chat-title" style="margin: 0; font-size: 16px; font-weight: 500;"><i
                            class="fas fa-sparkles"></i> Orion AI készenlétben</h2>
                </div>
                <button id="open-settings-btn" title="Beállítások"><i class="fas fa-cog"></i></button>
            </div>

            <div class="messages-container" id="messages-container"></div>

            <div class="input-area">
                <div id="file-preview-container">
                    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
                        <i class="fas fa-file-alt" style="color: var(--accent-color);"></i>
                        <span id="file-preview-name">file.txt</span>
                        <span id="file-preview-loading"
                            style="display:none; color: var(--accent-color); font-size: 11px;"><i
                                class="fas fa-spinner fa-spin"></i> Feldolgozás...</span>
                    </div>
                    <button id="remove-file-btn"
                        style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i
                            class="fas fa-times"></i></button>
                </div>

                <div class="input-wrapper">
                    <label for="file-upload" class="attach-btn" title="Fájl csatolása">
                        <i class="fas fa-plus"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;"
                        accept=".pdf,.txt,.py,.js,.html,.css,.jpg,.jpeg,.png,.webp">

                    <textarea id="message-input" placeholder="Kérdezz az Oriontól..." rows="1"></textarea>

                    <div class="input-controls">
                        <select id="model-selector" class="model-select">
                            <option value="smart">🧠 Smart</option>
                            <option value="fast">⚡ Fast</option>
                            <option value="creative">🔥 Creative</option>
                            <option value="code">💻 Code</option>
                        </select>
                        <button id="send-btn" class="circle-send-btn"><i class="fas fa-arrow-up"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Az Orion AI hibázhat. Kérjük, ellenőrizd a fontos adatokat.
                </div>
            </div>
        </main>
    </div>

    <!-- BEÁLLÍTÁSOK MODAL -->
    <div id="settings-modal" class="broadcast-modal" style="display: none;">
        <div class="glass-panel broadcast-content"
            style="text-align: left; max-width: 400px; width: 90%; padding: 25px; border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--accent-color); margin: 0; font-size: 20px;"><i class="fas fa-sliders-h"></i>
                    Beállítások</h3>
                <button id="close-settings-btn"
                    style="background: transparent; border: none; color: inherit; cursor: pointer; font-size: 20px;"><i
                        class="fas fa-times"></i></button>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">Megjelenés</label>
                <select id="theme-select" style="width: 100%; padding: 10px; border-radius: 8px; outline: none;">
                    <option value="dark">🌙 Sötét mód</option>
                    <option value="light">☀️ Világos mód</option>
                </select>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">Nyelv</label>
                <select id="language-select" style="width: 100%; padding: 10px; border-radius: 8px; outline: none;">
                    <option value="hu">🇭🇺 Magyar</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <button id="save-settings-btn" class="glass-btn"
                style="width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; cursor: pointer;">Mentés</button>
        </div>
    </div>

    <!-- RENDSZERÜZENET MODAL -->
    <div id="broadcast-modal" class="broadcast-modal" style="display: none;">
        <div class="glass-panel broadcast-content"
            style="padding: 25px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%;">
            <div style="font-size: 40px; color: var(--accent-color);"><i class="fas fa-bullhorn"></i></div>
            <h3 style="font-size: 18px; font-weight: 600;">Rendszerüzenet</h3>
            <p id="broadcast-text-content"
                style="font-size: 14px; line-height: 1.5; padding: 15px; border-radius: 12px; text-align: left;"></p>
            <button id="close-broadcast-btn" class="glass-btn"
                style="padding: 10px; font-size: 14px; border-radius: 10px; width: 100%; margin-top: 10px;">Bezárás</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                if (window.innerWidth > 768) {
                    sidebar.classList.toggle('collapsed');
                } else {
                    sidebar.classList.add('mobile-open');
                    mobileOverlay.classList.add('active');
                }
            });
        }

        if (closeMenuBtn) closeMenuBtn.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });
        if (mobileOverlay) mobileOverlay.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });

        const settingsBtn = document.getElementById('open-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const themeSelect = document.getElementById('theme-select');
        const languageSelect = document.getElementById('language-select');

        if (localStorage.getItem('orion_theme') === 'light') {
            document.body.classList.add('light-mode');
            if (themeSelect) themeSelect.value = 'light';
        }
        if (localStorage.getItem('orion_language') && languageSelect) {
            languageSelect.value = localStorage.getItem('orion_language');
        }

        if (settingsBtn) settingsBtn.onclick = () => settingsModal.style.display = 'flex';
        if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsModal.style.display = 'none';
        if (saveSettingsBtn) {
            saveSettingsBtn.onclick = () => {
                localStorage.setItem('orion_theme', themeSelect.value);
                if (themeSelect.value === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
                localStorage.setItem('orion_language', languageSelect.value);
                settingsModal.style.display = 'none';
            };
        }
    </script>
</body>

</html>
