<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Orion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="manifest" href="/static/manifest.json">
    
    <style>
        /* =========================================
           ALAP ÉS LOGÓ (KORÁBBI JAVÍTÁSOK)
           ========================================= */
        .orion-brand { display: flex !important; align-items: center !important; gap: 15px !important; }
        .orion-logo { width: 40px !important; height: 40px !important; min-width: 40px !important; min-height: 40px !important; flex-shrink: 0 !important; overflow: visible !important; display: block !important; }
        .spinning-ring { transform-origin: 50px 50px !important; transform-box: view-box !important; }
        .fa-spinner, .fa-circle-notch, .fa-spin { display: inline-block !important; width: 24px !important; height: 24px !important; line-height: 24px !important; text-align: center !important; transform-origin: center center !important; animation: fa-spin 1s linear infinite !important; margin: 0 auto !important; }
        .message.assistant:has(.fa-spinner), .message.system:has(.fa-spinner), .message.assistant:has(svg), .message.system:has(svg) { text-align: center !important; align-items: center !important; }

        /* =========================================
           KOMPAKT OLDALSÁV (Gemini stílus)
           ========================================= */
        .compact-btn { 
            padding: 8px 12px !important; /* Kisebb gomb magasság */
            font-size: 13px !important; 
            border-radius: 8px !important;
        }

        .chat-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; max-height: calc(100vh - 220px); padding-right: 4px; }
        
        .chat-list-item {
            padding: 8px 10px !important; /* Vékonyabb chatelemek */
            font-size: 13px !important;
            border-radius: 8px !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            transition: background 0.2s;
            position: relative;
            cursor: pointer;
            color: var(--text-main);
        }
        .chat-list-item:hover { background: rgba(255, 255, 255, 0.05); }
        .chat-list-item .chat-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

        /* 3 PÖTTY MENÜ */
        .chat-actions { position: relative; }
        .dots-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
        .dots-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }
        
        .chat-dropdown {
            position: absolute; right: 0; top: 100%;
            background: #1e1e2e; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; min-width: 120px;
            z-index: 50; overflow: hidden;
            display: none; /* JS fogja kapcsolni */
        }
        .chat-dropdown.show { display: flex; }
        .chat-dropdown button {
            background: transparent; border: none; color: #e2e8f0;
            padding: 10px 12px; text-align: left; font-size: 12px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .chat-dropdown button:hover { background: rgba(255,255,255,0.1); }
        .chat-dropdown button.delete-action:hover { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

        /* =========================================
           ÜZENETEK ÉS SZERKESZTÉS (Edit gomb)
           ========================================= */
        .messages-container { display: flex !important; flex-direction: column !important; padding-left: max(20px, calc(50% - 425px)) !important; padding-right: max(20px, calc(50% - 425px)) !important; align-items: stretch !important; overflow-x: hidden; }
        
        .message-wrapper { position: relative; width: fit-content; max-width: 100%; }
        .message-wrapper.user-wrapper { align-self: flex-end; }
        .message-wrapper.assistant-wrapper { align-self: flex-start; width: 100%; }

        .message { word-wrap: break-word !important; }
        .message.user { align-self: flex-end !important; width: fit-content !important; max-width: 100% !important; display: block !important; }
        .message.assistant, .message.system { align-self: flex-start !important; width: fit-content !important; max-width: 100% !important; display: flex !important; flex-direction: column !important; }
        .message.assistant .code-window { width: 100% !important; box-sizing: border-box !important; }

        /* Szerkesztés ikon ami hoverre jelenik meg a saját üzenetnél */
        .edit-message-btn {
            position: absolute; left: -30px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: var(--text-muted); cursor: pointer;
            opacity: 0; transition: opacity 0.2s; font-size: 14px; padding: 5px;
        }
        .message-wrapper.user-wrapper:hover .edit-message-btn { opacity: 1; }
        .edit-message-btn:hover { color: var(--text-main); }

        /* =========================================
           ÚJ BEVITELI MEZŐ (Gemini stílus kapszula)
           ========================================= */
        .input-area { display: flex !important; flex-direction: column !important; padding-left: max(20px, calc(50% - 425px)) !important; padding-right: max(20px, calc(50% - 425px)) !important; align-items: stretch !important; padding-bottom: 20px; }
        
        .input-wrapper {
            width: 100% !important; max-width: 100% !important;
            display: flex; align-items: flex-end; gap: 10px;
            background: rgba(30, 30, 46, 0.7); /* Sötét buborék */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Fájlfeltöltő "+" gomb */
        .attach-btn {
            background: rgba(255,255,255,0.05); border: none; color: var(--text-muted);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; transition: 0.2s; margin-bottom: 2px;
        }
        .attach-btn:hover { background: rgba(255,255,255,0.15); color: var(--text-main); }

        .input-wrapper textarea {
            flex: 1; background: transparent; border: none; color: white;
            resize: none; outline: none; font-size: 15px; line-height: 22px;
            padding: 8px 0; max-height: 150px; overflow-y: auto;
        }

        .input-controls {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-bottom: 2px;
        }

        /* Modellválasztó lenyíló */
        .model-select {
            appearance: none; -webkit-appearance: none;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 13px; font-weight: 600;
            cursor: pointer; padding: 8px 20px 8px 8px; outline: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2398989d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right center; background-size: 14px;
            transition: 0.2s;
        }
        .model-select:hover { color: var(--text-main); }
        .model-select option { background: #1e1e2e; color: white; }

        /* Beküldés / Leállítás gomb */
        .circle-send-btn {
            background: var(--text-main); color: #000; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .circle-send-btn:hover { transform: scale(1.05); background: white; }
        
        /* Stop állapot dizájnja */
        .circle-send-btn.stop-mode {
            background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; /* A gomb négyzetesebb lesz megállításnál */
        }
        .circle-send-btn.stop-mode:hover { background: rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 1); }

        .disclaimer { width: 100% !important; max-width: 100% !important; text-align: center !important; font-size: 11px; opacity: 0.6; margin-top: 10px; }

        /* Világos mód javítások */
        body.light-mode .input-wrapper { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        body.light-mode .input-wrapper textarea { color: #0f172a; }
        body.light-mode .attach-btn { color: #475569; background: rgba(0,0,0,0.05); }
        body.light-mode .model-select { color: #475569; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); }
        body.light-mode .model-select option { background: #fff; color: #000; }
        body.light-mode .chat-dropdown { background: #fff; border-color: rgba(0,0,0,0.1); }
        body.light-mode .chat-dropdown button { color: #0f172a; }
        body.light-mode .chat-dropdown button:hover { background: rgba(0,0,0,0.05); }
        body.light-mode .chat-dropdown button.delete-action:hover { background: rgba(239, 68, 68, 0.1); color: #dc2626; }
        
        @media (min-width: 769px) {
            .mobile-menu-btn { display: flex !important; align-items: center; justify-content: center; }
            .sidebar { transition: width 0.3s ease, padding 0.3s ease, opacity 0.3s ease, border-color 0.3s ease !important; white-space: nowrap; }
            .sidebar.collapsed { width: 0 !important; padding-left: 0 !important; padding-right: 0 !important; border-right-color: transparent !important; overflow: hidden !important; opacity: 0 !important; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(163, 112, 247, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(163, 112, 247, 0.6); }
    </style>
</head>
<body data-user="{{ username }}" class="dark-mode">
    <div class="liquid-bg">
        <div class="blob one"></div><div class="blob two"></div><div class="blob three"></div>
    </div>

    <div class="glass-panel app-container">
        <div class="mobile-overlay" id="mobile-overlay"></div>

        <aside class="sidebar">
            <button id="close-menu-btn" class="close-menu-btn"><i class="fas fa-times"></i></button>

            <div class="orion-brand">
                <svg class="orion-logo" width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g class="spinning-ring">
                        <circle cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="60 30" stroke-linecap="round"/>
                    </g>
                    <circle cx="32" cy="68" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)"/>
                    <circle cx="50" cy="50" r="6" fill="#a370f7" filter="drop-shadow(0 0 8px #a370f7)"/>
                    <circle cx="68" cy="32" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)"/>
                    <line x1="35" y1="65" x2="46" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                    <line x1="54" y1="46" x2="65" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#a370f7"/><stop offset="1" stop-color="#4f46e5"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1 class="orion-title">Orion <span>AI</span></h1>
            </div>

            <button id="new-chat-btn" class="glass-btn compact-btn">
                <i class="fas fa-plus"></i> Új beszélgetés
            </button>
            
            <!-- Minta Chat Lista a 3 pötty menüvel -->
            <div class="chat-list" id="chat-list">
                <!-- Ezt a backend script.js generálja, de vizuálisan most így fog kinézni:
                <div class="chat-list-item">
                    <span class="chat-title"><i class="fas fa-thumbtack" style="font-size:10px; margin-right:5px; color:var(--accent-color);"></i> Orion AI és Render</span>
                    <div class="chat-actions">
                        <button class="dots-btn" onclick="toggleDropdown(this)"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="chat-dropdown">
                            <button class="rename-btn"><i class="fas fa-pen"></i> Átnevezés</button>
                            <button class="pin-btn"><i class="fas fa-thumbtack"></i> Kitűzés</button>
                            <button class="delete-action"><i class="fas fa-trash"></i> Törlés</button>
                        </div>
                    </div>
                </div>
                -->
            </div>

            <div class="user-info-bottom">
                {% if username == 'admin' %}
                <a href="{{ url_for('admin_panel') }}" class="glass-btn compact-btn" style="text-decoration: none; text-align: center; margin-bottom: 15px;">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </a>
                {% endif %}
                <div class="user-info-content">
                    {% if username == 'Vendég' %}
                        <span><i class="fas fa-user-secret" style="color: var(--text-muted);"></i> <b>{{ username }}</b></span>
                        <a href="{{ url_for('login') }}" class="logout-link" style="color: var(--accent-color); font-weight: 600;"><i class="fas fa-sign-in-alt"></i> Belépés</a>
                    {% else %}
                        <span><i class="fas fa-user-astronaut"></i> <b>{{ username }}</b></span>
                        <a href="{{ url_for('logout') }}" class="logout-link"><i class="fas fa-sign-out-alt"></i> Kilépés</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <main class="chat-window">
            <div class="chat-header" style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="mobile-menu-btn" class="mobile-menu-btn" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: inherit;"><i class="fas fa-bars"></i></button>
                    <h2 id="current-chat-title" style="font-size: 18px; font-weight: 500; margin: 0;"><i class="fas fa-sparkles"></i> Orion AI készenlétben</h2>
                </div>
                <button id="open-settings-btn" style="background: transparent; border: none; color: inherit; font-size: 22px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'" title="Beállítások">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
            
            <div class="messages-container" id="messages-container">
                <!-- Felhasználói üzenet minta szerkesztés gombbal (backend generálja) -->
                <!--
                <div class="message-wrapper user-wrapper">
                    <button class="edit-message-btn" title="Üzenet szerkesztése"><i class="fas fa-pen"></i></button>
                    <div class="message user"><div class="message-content">Szia!</div></div>
                </div>
                -->
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <!-- Fájlfeltöltés Gomb -->
                    <label for="file-upload" class="attach-btn" title="Kép vagy fájl feltöltése">
                        <i class="fas fa-plus"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;">
                    
                    <textarea id="message-input" placeholder="Kérdezz az Oriontól..." rows="1"></textarea>
                    
                    <div class="input-controls">
                        <!-- Modellválasztó lenyíló -->
                        <select id="model-selector" class="model-select">
                            <option value="smart">🧠 Smart</option>
                            <option value="fast">⚡ Fast</option>
                            <option value="creative">🔥 Creative</option>
                            <option value="code">💻 Code</option>
                        </select>
                        
                        <!-- Küldés gomb (JS-el változik az ikonja megállításra) -->
                        <button id="send-btn" class="circle-send-btn"><i class="fas fa-arrow-up"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Az Orion AI egy mesterséges intelligencia, amely hibázhat. Kérjük, ellenőrizd a fontos adatokat.
                </div>
            </div>
        </main>
    </div>

    <!-- ... (Beállítások és Broadcast Modal marad ugyanaz) ... -->
    <div id="settings-modal" class="broadcast-modal" style="display: none;">
        <div class="glass-panel broadcast-content" style="text-align: left; max-width: 400px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--accent-color); margin: 0; font-size: 20px;"><i class="fas fa-sliders-h"></i> Beállítások</h3>
                <button id="close-settings-btn" style="background: transparent; border: none; color: inherit; cursor: pointer; font-size: 20px;"><i class="fas fa-times"></i></button>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">Megjelenés</label>
                <select id="theme-select" style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); outline: none;">
                    <option value="dark">🌙 Sötét mód</option>
                    <option value="light">☀️ Világos mód</option>
                </select>
            </div>
            <button id="save-settings-btn" class="glass-btn" style="width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; cursor: pointer;">
                <i class="fas fa-save"></i> Beállítások Mentése
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
    <script>
    // --- UI ESEMÉNYEK: Dropdown, Gombok ---

    // 3 pötty menü nyitó függvény (Ezt a script.js-ben a chat generálásakor rákötheted)
    window.toggleDropdown = function(btn) {
        // Bezárja a többit
        document.querySelectorAll('.chat-dropdown.show').forEach(menu => {
            if (menu !== btn.nextElementSibling) menu.classList.remove('show');
        });
        const dropdown = btn.nextElementSibling;
        dropdown.classList.toggle('show');
    };

    // Ha mellékattintanak, zárja be a menüt
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.chat-actions')) {
            document.querySelectorAll('.chat-dropdown.show').forEach(menu => menu.classList.remove('show'));
        }
    });

    // --- LEÁLLÍTÁS GOMB DEMÓ LOGIKA ---
    // Ezt a script.js-ben kell megírnod rendesen, de így tudod vizuálisan kezelni:
    const sendBtn = document.getElementById('send-btn');
    
    // DEMO: Kattintásra átvált "stop" ikonra (mintha generálna)
    sendBtn.addEventListener('click', function() {
        if (this.classList.contains('stop-mode')) {
            // STOP gomb megnyomva: itt küldesz megszakítást a szervernek
            console.log("Generálás leállítva!");
            resetSendButton();
        } else {
            // KÜLDÉS gomb megnyomva
            if(document.getElementById('message-input').value.trim() !== "") {
                this.classList.add('stop-mode');
                this.innerHTML = '<i class="fas fa-stop"></i>';
                // Szimulált válaszadás vége:
                // setTimeout(resetSendButton, 3000); 
            }
        }
    });

    function resetSendButton() {
        sendBtn.classList.remove('stop-mode');
        sendBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
    }


    // --- KORÁBBI FUNKCIÓK ---
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const sidebar = document.querySelector('.sidebar');
    const mobileOverlay = document.getElementById('mobile-overlay');
    mobileMenuBtn.addEventListener('click', () => {
        if (window.innerWidth > 768) sidebar.classList.toggle('collapsed');
        else { sidebar.classList.add('active'); mobileOverlay.classList.add('active'); }
    });
    if (mobileOverlay) mobileOverlay.addEventListener('click', () => { sidebar.classList.remove('active'); mobileOverlay.classList.remove('active'); });

    // Beállítások mentése
    const themeSelect = document.getElementById('theme-select');
    if (localStorage.getItem('orion_theme') === 'light') { document.body.classList.add('light-mode'); themeSelect.value = 'light'; }
    document.getElementById('open-settings-btn').onclick = () => document.getElementById('settings-modal').style.display = 'flex';
    document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-modal').style.display = 'none';
    
    document.getElementById('save-settings-btn').onclick = () => {
        localStorage.setItem('orion_theme', themeSelect.value);
        if (themeSelect.value === 'light') document.body.classList.add('light-mode');
        else document.body.classList.remove('light-mode');
        const btn = document.getElementById('save-settings-btn');
        btn.innerHTML = '<i class="fas fa-check"></i> Elmentve!';
        btn.style.background = '#4ade80';
        setTimeout(() => { btn.innerHTML = '<i class="fas fa-save"></i> Beállítások Mentése'; btn.style.background = ''; document.getElementById('settings-modal').style.display = 'none'; }, 1000);
    };

    // OKOS FORMÁZÓ: Kódblokk másolás
    window.orionCopyCode = function(button) {
        const codeText = button.closest('.code-window').querySelector('pre').innerText;
        navigator.clipboard.writeText(codeText).then(() => {
            const orig = button.innerHTML; button.innerHTML = '<i class="fas fa-check"></i> Másolva!'; button.style.color = '#4ade80'; 
            setTimeout(() => { button.innerHTML = orig; button.style.color = ''; }, 2000);
        });
    };
    </script>
</body>
</html>
