<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        /* Stabil mobil nézet és magasságkezelés */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            /* Megakadályozza a billentyűzet alatti elcsúszást/nagyítást */
        }

        .orion-brand {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .orion-logo {
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
            min-height: 32px !important;
            flex-shrink: 0 !important;
            overflow: visible !important;
            display: block !important;
        }

        .orion-title {
            font-size: 18px !important;
        }

        .spinning-ring {
            transform-origin: 50px 50px !important;
            transform-box: view-box !important;
        }

        .fa-spinner,
        .fa-circle-notch,
        .fa-spin {
            display: inline-block !important;
            width: 24px !important;
            height: 24px !important;
            line-height: 24px !important;
            text-align: center !important;
            transform-origin: center center !important;
            animation: fa-spin 1s linear infinite !important;
            margin: 0 auto !important;
        }

        /* Chat elemek és rejtett menü hosszan nyomáshoz (Long Press) */
        .chat-list-item {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 8px !important;
            padding: 12px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            position: relative !important;
            user-select: none;
            -webkit-user-select: none;
        }

        .chat-title {
            flex: 1 !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
        }

        /* Mobilon eltüntetjük a 3 pöttyöt, helyette hosszan nyomás van */
        @media (max-width: 768px) {
            .chat-actions {
                display: none !important;
            }
        }

        @media (min-width: 769px) {
            .chat-actions {
                position: relative !important;
                flex-shrink: 0 !important;
                display: flex !important;
                align-items: center !important;
            }
        }

        .dots-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .dots-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: #1e1e2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex-direction: column;
            min-width: 130px;
            z-index: 100;
            overflow: hidden;
            display: none;
        }

        .chat-dropdown.show {
            display: flex;
        }

        .chat-dropdown button {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .chat-dropdown button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown button.delete-action:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Üzenet buborékok */
        .messages-container {
            display: flex !important;
            flex-direction: column !important;
            gap: 15px !important;
            padding: 20px !important;
            overflow-y: auto !important;
            height: 100%;
            box-sizing: border-box;
        }

        .message-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }

        .message-wrapper.assistant-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            width: fit-content !important;
            max-width: 85% !important;
            box-sizing: border-box;
        }

        .message.user {
            background: #9333ea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .edit-message-btn {
            position: absolute;
            left: -25px;
            top: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
        }

        .message-wrapper.user-wrapper:hover .edit-message-btn {
            opacity: 1;
        }

        /* Beviteli mező */
        .input-area {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            padding: 12px 20px 20px 20px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 750px !important;
            width: 100% !important;
            box-sizing: border-box !important;
            display: flex !important;
            align-items: flex-end !important;
            gap: 8px !important;
            background: rgba(30, 30, 46, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 24px !important;
            padding: 6px 12px !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
        }

        #file-preview-container {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 46, 0.9);
            border: 1px solid rgba(163, 112, 247, 0.3);
            border-radius: 12px;
            padding: 8px 15px;
            margin-bottom: 8px;
            max-width: 750px;
            width: 100%;
            box-sizing: border-box;
        }

        .model-select {
            appearance: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px 6px 6px;
            outline: none;
        }

        .model-select option {
            background: #1e1e2e;
            color: white;
        }

        .disclaimer {
            max-width: 750px;
            width: 100%;
            text-align: center !important;
            font-size: 10px;
            opacity: 0.5;
            margin-top: 8px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 5px 0;
        }

        .close-menu-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            transition: 0.2s;
            opacity: 0.7;
        }

        .close-menu-btn:hover {
            opacity: 1;
        }

        .sidebar {
            transition: transform 0.3s ease;
        }

        @media (min-width: 769px) {
            .sidebar.collapsed {
                width: 0 !important;
                min-width: 0 !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                border: none !important;
                overflow: hidden !important;
                opacity: 0 !important;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                height: 100dvh;
                transform: translateX(-100%);
                z-index: 1000;
                width: 280px;
                box-sizing: border-box;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-overlay.active {
                display: block;
            }

            .close-menu-btn {
                display: block;
            }

            .chat-header {
                padding: 10px 12px !important;
                gap: 8px !important;
            }

            #current-chat-title {
                font-size: 14px !important;
            }

            #mobile-menu-btn,
            #open-settings-btn {
                font-size: 18px !important;
                padding: 4px !important;
            }

            .model-select {
                font-size: 11px !important;
                padding: 4px 14px 4px 4px !important;
            }

            .messages-container {
                padding: 15px 12px !important;
                gap: 12px !important;
            }

            .message {
                font-size: 13.5px;
                padding: 10px 14px;
                max-width: 90% !important;
            }

            .input-area {
                padding: 10px 12px 15px 12px !important;
            }

            .input-wrapper {
                padding: 6px 10px !important;
            }

            .attach-btn,
            .circle-send-btn {
                margin-bottom: 2px !important;
            }

            #message-input {
                padding: 8px 0 !important;
                font-size: 13.5px !important;
            }
        }

        /* VILÁGOS MÓD KONTRASZT */
        body.light-mode {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }

        body.light-mode .app-container {
            background: #ffffff !important;
        }

        body.light-mode .sidebar {
            background: #f1f5f9 !important;
            border-right-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-header {
            background: #ffffff !important;
            border-bottom-color: rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
        }

        body.light-mode .input-area {
            background: #ffffff !important;
            border-top-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .input-wrapper {
            background: #f1f5f9 !important;
            border: 1px solid rgba(0, 0, 0, 0.15) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03) !important;
        }

        body.light-mode .input-wrapper textarea {
            color: #0f172a !important;
        }

        body.light-mode .message.assistant {
            background: #f1f5f9 !important;
            border: 1px solid rgba(0, 0, 0, 0.1) !important;
            color: #0f172a !important;
        }

        body.light-mode .chat-list-item {
            color: #334155 !important;
        }

        body.light-mode .chat-list-item:hover,
        body.light-mode .chat-list-item.active {
            background: rgba(0, 0, 0, 0.07) !important;
            color: #0f172a !important;
            font-weight: 600;
        }

        body.light-mode .chat-dropdown {
            background: #ffffff !important;
            border-color: rgba(0, 0, 0, 0.15) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode .chat-dropdown button {
            color: #0f172a !important;
        }

        body.light-mode .chat-dropdown button:hover {
            background: rgba(0, 0, 0, 0.05) !important;
        }

        body.light-mode .model-select {
            color: #334155 !important;
        }

        body.light-mode .model-select option {
            background: #ffffff !important;
            color: #0f172a !important;
        }

        body.light-mode .circle-send-btn {
            background: #0f172a !important;
            color: #ffffff !important;
        }

        body.light-mode .broadcast-content {
            background: #ffffff !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        body.light-mode select {
            background: #f8fafc !important;
            color: #0f172a !important;
            border-color: rgba(0, 0, 0, 0.2) !important;
        }

        body.light-mode .close-menu-btn {
            color: #0f172a !important;
        }

        body.light-mode .orion-title {
            color: #0f172a !important;
        }

        body.light-mode .user-info-content {
            color: #334155 !important;
        }
    </style>
</head>

<body data-user="{{ username }}" class="dark-mode">
    <div class="liquid-bg">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>
    </div>

    <div class="glass-panel app-container"
        style="display: flex; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; position: relative;">
        <div class="mobile-overlay" id="mobile-overlay"
            style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 900; backdrop-filter: blur(3px);">
        </div>

        <!-- OLDALSÁV -->
        <aside class="sidebar" id="sidebar"
            style="width: 280px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; z-index: 1000;">
            <div class="sidebar-header">
                <div class="orion-brand">
                    <svg class="orion-logo" viewBox="0 0 100 100" fill="none">
                        <circle cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="60 30"
                            stroke-linecap="round" />
                        <circle cx="32" cy="68" r="5" fill="#ffffff" />
                        <circle cx="50" cy="50" r="6" fill="#a370f7" />
                        <circle cx="68" cy="32" r="5" fill="#ffffff" />
                        <defs>
                            <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100"
                                gradientUnits="userSpaceOnUse">
                                <stop stop-color="#a370f7" />
                                <stop offset="1" stop-color="#4f46e5" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <h1 class="orion-title">Orion <span>AI</span></h1>
                </div>
                <button id="close-menu-btn" class="close-menu-btn"><i class="fas fa-times"></i></button>
            </div>

            <button id="new-chat-btn" class="glass-btn compact-btn"
                style="padding: 10px 14px; font-size: 13px; border-radius: 10px; margin-bottom: 10px; background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-plus"></i> Új beszélgetés
            </button>

            <div class="chat-list" id="chat-list"
                style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;"></div>

            <div class="user-info-bottom"
                style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 10px;">
                {% if username == 'admin' %}
                <a href="{{ url_for('admin_panel') }}" class="glass-btn compact-btn"
                    style="text-decoration: none; text-align: center; margin-bottom: 10px; display: block; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; color: inherit;">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </a>
                {% endif %}
                <div class="user-info-content"
                    style="display: flex; align-items: center; justify-content: space-between; font-size: 13px;">
                    {% if username == 'Vendég' %}
                    <span><i class="fas fa-user-secret"></i> <b>{{ username }}</b></span>
                    <a href="{{ url_for('login') }}" class="logout-link"
                        style="color: var(--accent); font-weight: 600; text-decoration: none;"><i
                            class="fas fa-sign-in-alt"></i> Belépés</a>
                    {% else %}
                    <span><i class="fas fa-user-astronaut"></i> <b>{{ username }}</b></span>
                    <a href="{{ url_for('logout') }}" class="logout-link"
                        style="color: var(--accent); font-weight: 600; text-decoration: none;"><i
                            class="fas fa-sign-out-alt"></i> Kilépés</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <!-- CHAT ABLAK -->
        <main class="chat-window"
            style="flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative;">
            <div class="chat-header"
                style="display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <div style="display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1;">
                    <button id="mobile-menu-btn"
                        style="background: transparent; border: none; font-size: 18px; cursor: pointer; color: inherit; padding: 4px;"
                        title="Menü">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="current-chat-title"
                        style="font-size: 16px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        <i class="fas fa-sparkles"></i> Orion AI</h2>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                    <div id="header-model-slot"></div>
                    <button id="open-settings-btn"
                        style="background: transparent; border: none; color: inherit; font-size: 18px; cursor: pointer; opacity: 0.7; padding: 4px;"
                        title="Beállítások">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messages-container"></div>

            <div class="input-area">
                <div id="file-preview-container">
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px;">
                        <i class="fas fa-file-alt" style="color: var(--accent);"></i>
                        <span id="file-preview-name">file.txt</span>
                        <span id="file-preview-loading" style="display:none; color: var(--accent); font-size: 11px;"><i
                                class="fas fa-spinner fa-spin"></i></span>
                    </div>
                    <button id="remove-file-btn"
                        style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i
                            class="fas fa-times"></i></button>
                </div>

                <div class="input-wrapper">
                    <label for="file-upload" class="attach-btn" title="Fájl csatolása"
                        style="background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0;">
                        <i class="fas fa-plus" style="font-size: 13px;"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;"
                        accept=".pdf,.txt,.py,.js,.html,.css,.jpg,.jpeg,.png,.webp">

                    <textarea id="message-input" placeholder="Írj üzenetet..." rows="1"
                        style="flex: 1; background: transparent; border: none; color: inherit; resize: none; outline: none; font-size: 14px; line-height: 20px; padding: 8px 0; max-height: 120px;"></textarea>

                    <div class="input-controls" style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
                        <div id="footer-model-slot">
                            <select id="model-selector" class="model-select">
                                <option value="smart">🧠 Smart</option>
                                <option value="fast">⚡ Fast</option>
                                <option value="creative">🔥 Creative</option>
                                <option value="code">💻 Code</option>
                            </select>
                        </div>
                        <button id="send-btn" class="circle-send-btn"
                            style="background: var(--text-main); color: #000; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;"><i
                                class="fas fa-arrow-up" style="font-size: 13px;"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Az Orion AI hibázhat. Ellenőrizd a fontos adatokat.
                </div>
            </div>
        </main>
    </div>

    <!-- BEÁLLÍTÁSOK MODAL -->
    <div id="settings-modal" class="broadcast-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center;">
        <div class="glass-panel broadcast-content"
            style="text-align: left; max-width: 380px; width: 90%; padding: 20px; border-radius: 16px; background: #1e1e2e; border: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: var(--accent); margin: 0; font-size: 18px;"><i class="fas fa-sliders-h"></i>
                    Beállítások</h3>
                <button id="close-settings-btn"
                    style="background: transparent; border: none; color: inherit; cursor: pointer; font-size: 18px;"><i
                        class="fas fa-times"></i></button>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 4px; font-size: 12px; opacity: 0.8;">Megjelenés</label>
                <select id="theme-select"
                    style="width: 100%; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;">
                    <option value="dark">🌙 Sötét mód</option>
                    <option value="light">☀️ Világos mód</option>
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 4px; font-size: 12px; opacity: 0.8;">Nyelv</label>
                <select id="language-select"
                    style="width: 100%; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;">
                    <option value="hu">🇭🇺 Magyar</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <button id="save-settings-btn" class="glass-btn"
                style="width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; cursor: pointer; background: var(--accent); border: none; color: white; font-weight: bold;">Mentés</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        // Modellválasztó helye mobilon és PC-n
        function adaptModelSelector() {
            const modelSelector = document.getElementById('model-selector');
            const headerSlot = document.getElementById('header-model-slot');
            const footerSlot = document.getElementById('footer-model-slot');

            if (window.innerWidth <= 768) {
                if (modelSelector && headerSlot && !headerSlot.contains(modelSelector)) {
                    headerSlot.appendChild(modelSelector);
                }
            } else {
                if (modelSelector && footerSlot && !footerSlot.contains(modelSelector)) {
                    footerSlot.appendChild(modelSelector);
                }
            }
        }
        window.addEventListener('resize', adaptModelSelector);
        window.addEventListener('DOMContentLoaded', adaptModelSelector);

        // Oldalsáv kezelés és Swipe (jobbra húzás) gesztus mobilon
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                if (window.innerWidth > 768) {
                    sidebar.classList.toggle('collapsed');
                } else {
                    sidebar.classList.add('mobile-open');
                    mobileOverlay.style.display = 'block';
                    mobileOverlay.classList.add('active');
                }
            });
        }

        function closeSidebar() {
            sidebar.classList.remove('mobile-open');
            mobileOverlay.classList.remove('active');
            setTimeout(() => { if (!mobileOverlay.classList.contains('active')) mobileOverlay.style.display = 'none'; }, 300);
        }

        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeSidebar);
        if (mobileOverlay) mobileOverlay.addEventListener('click', closeSidebar);

        // Swipe gesztus támogatás (bal szélről jobbra húzás)
        let touchStartX = 0;
        window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
        window.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            if (touchStartX < 40 && touchEndX - touchStartX > 70 && window.innerWidth <= 768) {
                sidebar.classList.add('mobile-open');
                mobileOverlay.style.display = 'block';
                mobileOverlay.classList.add('active');
            }
        }, { passive: true });

        // Beállítások Modal logika
        const settingsBtn = document.getElementById('open-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const themeSelect = document.getElementById('theme-select');
        const languageSelect = document.getElementById('language-select');

        if (localStorage.getItem('orion_theme') === 'light') {
            document.body.classList.add('light-mode');
            if (themeSelect) themeSelect.value = 'light';
        }
        if (localStorage.getItem('orion_language') && languageSelect) {
            languageSelect.value = localStorage.getItem('orion_language');
        }

        if (settingsBtn) settingsBtn.onclick = () => settingsModal.style.display = 'flex';
        if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsModal.style.display = 'none';
        if (saveSettingsBtn) {
            saveSettingsBtn.onclick = () => {
                localStorage.setItem('orion_theme', themeSelect.value);
                if (themeSelect.value === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
                localStorage.setItem('orion_language', languageSelect.value);
                settingsModal.style.display = 'none';
            };
        }
    </script>
</body>

</html>
