<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orion AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        /* Eredeti márkajelzés és ikonok stabilizálása */
        .orion-brand {
            display: flex !important;
            align-items: center !important;
            gap: 15px !important;
        }

        .orion-logo {
            width: 40px !important;
            height: 40px !important;
            min-width: 40px !important;
            min-height: 40px !important;
            flex-shrink: 0 !important;
            overflow: visible !important;
            display: block !important;
        }

        .spinning-ring {
            transform-origin: 50px 50px !important;
            transform-box: view-box !important;
        }

        .fa-spinner,
        .fa-circle-notch,
        .fa-spin {
            display: inline-block !important;
            width: 24px !important;
            height: 24px !important;
            line-height: 24px !important;
            text-align: center !important;
            transform-origin: center center !important;
            animation: fa-spin 1s linear infinite !important;
            margin: 0 auto !important;
        }

        /* 3 pöttyös menü */
        .chat-actions {
            position: relative;
        }

        .dots-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .dots-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: #1e1e2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            flex-direction: column;
            min-width: 120px;
            z-index: 50;
            overflow: hidden;
            display: none;
        }

        .chat-dropdown.show {
            display: flex;
        }

        .chat-dropdown button {
            background: transparent;
            border: none;
            color: #e2e8f0;
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-dropdown button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-dropdown button.delete-action:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Üzenetek és szerkesztés gomb */
        .message-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }

        .message-wrapper.assistant-wrapper {
            align-items: flex-start;
        }

        .message {
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .message.user {
            background: #9333ea;
            color: white;
            border-bottom-right-radius: 4px;
            max-width: 75%;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 100%;
            border-bottom-left-radius: 4px;
        }

        .edit-message-btn {
            position: absolute;
            left: -30px;
            top: 15px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
        }

        .message-wrapper.user-wrapper:hover .edit-message-btn {
            opacity: 1;
        }

        .edit-message-btn:hover {
            color: var(--text-main);
        }

        /* Fájl előnézet */
        #file-preview-container {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 46, 0.9);
            border: 1px solid rgba(163, 112, 247, 0.3);
            border-radius: 12px;
            padding: 8px 15px;
            margin-bottom: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* PC-s összecsukhatóság javítva */
        .sidebar {
            transition: width 0.3s ease, transform 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        }

        @media (min-width: 769px) {
            .sidebar.collapsed {
                width: 0 !important;
                min-width: 0 !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                border: none !important;
                overflow: hidden !important;
                opacity: 0 !important;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-overlay.active {
                display: block;
            }
        }
    </style>
</head>

<body data-user="{{ username }}" class="dark-mode">
    <div class="liquid-bg">
        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>
    </div>

    <div class="glass-panel app-container">
        <div class="mobile-overlay" id="mobile-overlay"></div>

        <!-- OLDALSÁV -->
        <aside class="sidebar" id="sidebar">
            <button id="close-menu-btn" class="close-menu-btn"><i class="fas fa-times"></i></button>

            <div class="orion-brand">
                <svg class="orion-logo" width="40" height="40" viewBox="0 0 100 100" fill="none">
                    <g class="spinning-ring">
                        <circle cx="50" cy="50" r="42" stroke="url(#gradient)" stroke-width="4" stroke-dasharray="60 30"
                            stroke-linecap="round" />
                    </g>
                    <circle cx="32" cy="68" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)" />
                    <circle cx="50" cy="50" r="6" fill="#a370f7" filter="drop-shadow(0 0 8px #a370f7)" />
                    <circle cx="68" cy="32" r="5" fill="#ffffff" filter="drop-shadow(0 0 6px #fff)" />
                    <line x1="35" y1="65" x2="46" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                    <line x1="54" y1="46" x2="65" y2="35" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#a370f7" />
                            <stop offset="1" stop-color="#4f46e5" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1 class="orion-title">Orion <span>AI</span></h1>
            </div>

            <button id="new-chat-btn" class="glass-btn compact-btn"
                style="padding: 10px 14px; font-size: 13px; border-radius: 10px;">
                <i class="fas fa-plus"></i> Új beszélgetés
            </button>

            <div class="chat-list" id="chat-list"></div>

            <div class="user-info-bottom">
                {% if username == 'admin' %}
                <a href="{{ url_for('admin_panel') }}" class="glass-btn compact-btn"
                    style="text-decoration: none; text-align: center; margin-bottom: 10px; display: block; padding: 8px;">
                    <i class="fas fa-shield-alt"></i> Admin Panel
                </a>
                {% endif %}
                <div class="user-info-content">
                    {% if username == 'Vendég' %}
                    <span><i class="fas fa-user-secret" style="color: var(--text-muted);"></i> <b>{{ username
                            }}</b></span>
                    <a href="{{ url_for('login') }}" class="logout-link"
                        style="color: var(--accent-color); font-weight: 600;"><i class="fas fa-sign-in-alt"></i>
                        Belépés</a>
                    {% else %}
                    <span><i class="fas fa-user-astronaut"></i> <b>{{ username }}</b></span>
                    <a href="{{ url_for('logout') }}" class="logout-link"><i class="fas fa-sign-out-alt"></i>
                        Kilépés</a>
                    {% endif %}
                </div>
            </div>
        </aside>

        <!-- CHAT ABLAK -->
        <main class="chat-window">
            <div class="chat-header"
                style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="mobile-menu-btn" class="mobile-menu-btn"
                        style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: inherit;"><i
                            class="fas fa-bars"></i></button>
                    <h2 id="current-chat-title" style="font-size: 18px; font-weight: 500; margin: 0;"><i
                            class="fas fa-sparkles"></i> Orion AI készenlétben</h2>
                </div>
                <button id="open-settings-btn"
                    style="background: transparent; border: none; color: inherit; font-size: 22px; cursor: pointer; opacity: 0.7; transition: opacity 0.2s;"
                    onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'" title="Beállítások">
                    <i class="fas fa-cog"></i>
                </button>
            </div>

            <div class="messages-container" id="messages-container"></div>

            <div class="input-area">
                <div id="file-preview-container">
                    <div style="display: flex; align-items: center; gap: 10px; color: #e2e8f0; font-size: 13px;">
                        <i class="fas fa-file-alt" style="color: var(--accent-color);"></i>
                        <span id="file-preview-name">file.txt</span>
                        <span id="file-preview-loading" style="display:none; color: #a370f7; font-size: 11px;"><i
                                class="fas fa-spinner fa-spin"></i> Feldolgozás...</span>
                    </div>
                    <button id="remove-file-btn"
                        style="background: transparent; border: none; color: #ef4444; cursor: pointer;"><i
                            class="fas fa-times"></i></button>
                </div>

                <div class="input-wrapper">
                    <label for="file-upload" class="attach-btn" title="Fájl csatolása">
                        <i class="fas fa-plus"></i>
                    </label>
                    <input type="file" id="file-upload" style="display: none;"
                        accept=".pdf,.txt,.py,.js,.html,.css,.jpg,.jpeg,.png,.webp">

                    <textarea id="message-input" placeholder="Kérdezz az Oriontól..." rows="1"></textarea>

                    <div class="input-controls">
                        <select id="model-selector" class="model-select">
                            <option value="smart">🧠 Smart</option>
                            <option value="fast">⚡ Fast</option>
                            <option value="creative">🔥 Creative</option>
                            <option value="code">💻 Code</option>
                        </select>
                        <button id="send-btn" class="circle-send-btn"><i class="fas fa-arrow-up"></i></button>
                    </div>
                </div>
                <div class="disclaimer">
                    Az Orion AI hibázhat. Kérjük, ellenőrizd a fontos adatokat.
                </div>
            </div>
        </main>
    </div>

    <!-- BEÁLLÍTÁSOK MODAL -->
    <div id="settings-modal" class="broadcast-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div class="glass-panel broadcast-content"
            style="text-align: left; max-width: 400px; width: 90%; padding: 25px; border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--accent-color); margin: 0; font-size: 20px;"><i class="fas fa-sliders-h"></i>
                    Beállítások</h3>
                <button id="close-settings-btn"
                    style="background: transparent; border: none; color: inherit; cursor: pointer; font-size: 20px;"><i
                        class="fas fa-times"></i></button>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">Megjelenés</label>
                <select id="theme-select"
                    style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); outline: none;">
                    <option value="dark">🌙 Sötét mód</option>
                    <option value="light">☀️ Világos mód</option>
                </select>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; opacity: 0.8;">Nyelv</label>
                <select id="language-select"
                    style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); outline: none;">
                    <option value="hu">🇭🇺 Magyar</option>
                    <option value="en">🇬🇧 English</option>
                </select>
            </div>

            <button id="save-settings-btn" class="glass-btn"
                style="width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; cursor: pointer;">Mentés</button>
        </div>
    </div>

    <!-- RENDSZERÜZENET MODAL -->
    <div id="broadcast-modal" class="broadcast-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div class="glass-panel broadcast-content"
            style="padding: 25px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%;">
            <div style="font-size: 40px; color: var(--accent-color);"><i class="fas fa-bullhorn"></i></div>
            <h3 style="color: white; font-size: 18px; font-weight: 600;">Rendszerüzenet</h3>
            <p id="broadcast-text-content"
                style="color: var(--text-main); font-size: 14px; line-height: 1.5; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; text-align: left;">
            </p>
            <button id="close-broadcast-btn" class="glass-btn"
                style="padding: 10px; font-size: 14px; border-radius: 10px; width: 100%; margin-top: 10px;">Bezárás</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <script>
        // --- HAMBURGER ÉS BEÁLLÍTÁSOK KEZELÉSE ---
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const closeMenuBtn = document.getElementById('close-menu-btn');

        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                if (window.innerWidth > 768) {
                    sidebar.classList.toggle('collapsed'); // PC-n összehúzza / kinyitja
                } else {
                    sidebar.classList.add('mobile-open'); // Mobilon becsúsztatja
                    mobileOverlay.classList.add('active');
                }
            });
        }

        if (closeMenuBtn) closeMenuBtn.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });
        if (mobileOverlay) mobileOverlay.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); mobileOverlay.classList.remove('active'); });

        // Beállítások Modal logika
        const settingsBtn = document.getElementById('open-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const themeSelect = document.getElementById('theme-select');
        const languageSelect = document.getElementById('language-select');

        if (localStorage.getItem('orion_theme') === 'light') {
            document.body.classList.add('light-mode');
            if (themeSelect) themeSelect.value = 'light';
        }
        if (localStorage.getItem('orion_language') && languageSelect) {
            languageSelect.value = localStorage.getItem('orion_language');
        }

        if (settingsBtn) settingsBtn.onclick = () => settingsModal.style.display = 'flex';
        if (closeSettingsBtn) closeSettingsBtn.onclick = () => settingsModal.style.display = 'none';
        if (saveSettingsBtn) {
            saveSettingsBtn.onclick = () => {
                localStorage.setItem('orion_theme', themeSelect.value);
                if (themeSelect.value === 'light') document.body.classList.add('light-mode');
                else document.body.classList.remove('light-mode');
                localStorage.setItem('orion_language', languageSelect.value);
                settingsModal.style.display = 'none';
            };
        }
    </script>
</body>

</html>
